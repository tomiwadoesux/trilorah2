<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Sandbox</title>
    <!-- Same display fonts as the main app, so previews match -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Paytone+One&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The main app locks body scroll; the sandbox should scroll freely. */
      html, body { overflow: auto; height: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design.main.tsx"></script>
  </body>
</html>
