<!doctype html>
<!-- The sandbox is dark-only for now; set before first paint to avoid a flash. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Sandbox</title>
    <!-- Same display fonts as the main app, so previews match -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Alfa+Slab+One&family=Paytone+One&family=Cormorant+Garamond:wght@600&family=EB+Garamond:wght@600&family=Playfair+Display:wght@600&family=Libre+Baskerville:wght@700&family=Fraunces:wght@600&family=Newsreader:wght@600&family=DM+Sans:wght@600&family=Outfit:wght@600&family=Plus+Jakarta+Sans:wght@600&family=Figtree:wght@600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The main app locks body scroll; the sandbox should scroll freely. */
      html, body { overflow: auto; height: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design.main.tsx"></script>
  </body>
</html>
