# Builds the installers churches download.
#
# Runs when a version tag is pushed (git tag v0.3.0 && git push origin v0.3.0),
# or by hand from the Actions tab. Windows and macOS each build on their own
# machine because the app carries native code (better-sqlite3, whisper.cpp)
# that has to be compiled on the platform it will run on — which is why the
# .exe cannot be produced from a Mac.
#
# Unsigned on both platforms for now. Windows shows "Windows protected your
# PC" (More info → Run anyway); macOS needs right-click → Open the first time.
# A code-signing certificate removes both, and slots in here as secrets later.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # bible.db and its index are far too large for git, so they are rebuilt
      # here from the same public-domain sources the developer machine used.
      # Without this step the installer ships an app with no Bible in it.
      - name: Build the Bible database
        run: |
          npm run bible:build
          npm run bible:index
          npm run bible:fts

      # Offline speech. whisper-node ships source, not a binary; without this
      # the Mac build has no local recogniser. Windows has no `make`, so there
      # its binary is fetched in the next step instead.
      - name: Compile whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: make -C node_modules/whisper-node/lib/whisper.cpp main

      # Offline speech on Windows. There is no `make` here, so instead of
      # compiling, take the whisper.cpp project's own prebuilt binary — same
      # 1.5.x line the macOS build compiles, same command-line flags. The app
      # runs it directly (electron/asr/whisperLocal.ts → whisperBinaryPath()).
      - name: Fetch whisper.cpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "node_modules/whisper-node/lib/whisper.cpp"
          Invoke-WebRequest -Uri "https://github.com/ggerganov/whisper.cpp/releases/download/v1.5.4/whisper-bin-x64.zip" -OutFile whisper-bin.zip
          Expand-Archive whisper-bin.zip -DestinationPath whisper-bin -Force
          Copy-Item whisper-bin/main.exe, whisper-bin/whisper.dll, whisper-bin/SDL2.dll -Destination $dest
          if (-not (Test-Path "$dest/main.exe")) { throw "main.exe did not land in $dest" }
          & "$dest/main.exe" --help | Select-Object -First 3

      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish never

      # An installer that builds is not an installer that works. These are the
      # files the app cannot run without; if packaging ever drops one, fail
      # here rather than in a church on Sunday morning.
      - name: Verify the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $r = "release/win-unpacked/resources"
          $need = @(
            "$r/bible.db",
            "$r/bible_index.json",
            "$r/app.asar.unpacked/node_modules/whisper-node/lib/whisper.cpp/main.exe",
            "$r/app.asar.unpacked/node_modules/whisper-node/lib/whisper.cpp/whisper.dll",
            "$r/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { $missing | ForEach-Object { Write-Host "MISSING: $_" }; throw "packaged app is incomplete" }
          $need | ForEach-Object { "{0,8:N1} MB  {1}" -f ((Get-Item $_).Length / 1MB), $_ }

      - name: Verify the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          r="release/mac-arm64/Trilorah.app/Contents/Resources"
          for f in bible.db bible_index.json \
            app.asar.unpacked/node_modules/whisper-node/lib/whisper.cpp/main \
            app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node; do
            [ -e "$r/$f" ] || { echo "MISSING: $r/$f"; exit 1; }
            ls -lh "$r/$f" | awk '{print $5, $9}'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: trilorah-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            **Windows:** download the `.exe`. Windows will say "Windows protected your PC" — click **More info → Run anyway**. Add a Deepgram key in Settings to use speech.

            **Mac (Apple Silicon):** download the `.dmg`. The first time, **right-click the app → Open**.
