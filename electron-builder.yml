appId: com.trilorah.app
productName: Trilorah

directories:
  output: release
  buildResources: build

# App payload: built renderer + built main/preload. Production node_modules
# are collected automatically by electron-builder from package.json deps.
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/node_modules"
  - "!**/.DS_Store"

# Native modules — must live outside app.asar to be require()-able.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/whisper-node/**"

# Runtime data shipped next to the app (resolved via process.resourcesPath).
extraResources:
  - from: bible.db
    to: bible.db
  - from: electron/data/bible_index.json
    to: bible_index.json
  - from: electron/agent/transition-phrases.json
    to: transition-phrases.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Unsigned for now (church pilot: right-click → Open). electron-builder
  # falls back to ad-hoc signing, which arm64 macOS requires to launch.
  identity: null
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

dmg:
  sign: false

# Church computers are overwhelmingly Windows — ship an installer for them.
# Build with: npx electron-builder --win (native modules must be rebuilt for
# win32; building on a Windows machine or CI is the reliable path).
win:
  icon: build/icon-1024.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  allowElevation: true
  deleteAppDataOnUninstall: false
